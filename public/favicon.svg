<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vizzyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0fb73" />
      <stop offset="100%" stop-color="#c6ea3c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Edge-to-Edge Bold V Emblem -->
  <path d="M 20 40 L 170 40 L 256 320 L 342 40 L 492 40 L 296 480 L 216 480 Z" 
        fill="url(#vizzyGrad)" 
        filter="url(#glow)" />

  <!-- Magic Sparkle Flare -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" opacity="0.9" />
    <path d="M -45 0 L 45 0 M 0 -45 L 0 45" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <path d="M -25 -25 L 25 25 M -25 25 L 25 -25" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>